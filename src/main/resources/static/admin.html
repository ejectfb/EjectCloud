<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>EjectCloud Admin</title>
    <link rel="icon" type="image/png" href="images/twitch-logo-transparent.png">
    <link rel="stylesheet" href="css/admin-legacy.css">
</head>
<body>
    <h1>EjectCloud - Админ панель</h1>
    
    <div class="section">
        <h2>Создать пользователя</h2>
        <div class="form-group">
            <input id="newUsername" placeholder="Username" />
            <input id="newQuota" type="number" placeholder="Квота (байты)" value="1073741824" />
            <input id="newDisplayName" placeholder="Отображаемое имя" />
            <button onclick="createUser()">Создать</button>
        </div>
    </div>
    
    <div class="section">
        <h2>Пользователи</h2>
        <button onclick="loadUsers()">Обновить список</button>
        <table id="usersTable">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Username</th>
                    <th>Telegram ID</th>
                    <th>Квота (MB)</th>
                    <th>Использовано (MB)</th>
                    <th>Свободно (MB)</th>
                    <th>Действия</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
    
    <div class="section">
        <h2>Настройки</h2>
        <div class="form-group">
            <label>Время неактивности (минуты):</label>
            <input id="inactiveMinutes" type="number" value="30" />
            <button onclick="updateSetting('token.inactive.minutes', document.getElementById('inactiveMinutes').value)">Сохранить</button>
        </div>
    </div>

    <script src="js/pages/admin-legacy.js"></script>
</body>
</html>
