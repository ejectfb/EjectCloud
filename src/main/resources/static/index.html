<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>EjectCloud</title>
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link rel="icon" type="image/png" href="images/twitch-logo-transparent.png">
    <link rel="stylesheet" href="css/icons.css">
    <link rel="stylesheet" href="css/dropzone.css">
    <link rel="stylesheet" href="css/app.css">
</head>
<body>

<div id="login">
    <h2>EjectCloud</h2>
    <p>Перенаправление на страницу входа...</p>
</div>

<div id="app" class="hidden">
    <div class="sidebar">
        <div class="sidebar-header">
            <span class="icon-text"><img class="icon" src="icons/logo-cloud.svg" alt="" aria-hidden="true">EjectCloud</span>
        </div>
        <div id="fileTree"></div>
    </div>

    <div id="drawerBackdrop" class="drawer-backdrop" onclick="closeDrawer()"></div>
    
    <div class="main-content">
        <div class="toolbar">
            <div class="toolbar-left">
                <button id="menuBtn" onclick="toggleDrawer()" class="secondary menu-button" title="Меню" aria-label="Меню">
                    &#9776;
                </button>
                <button id="uploadBtn" onclick="uploadFiles()" class="primary">
                    <img class="icon btn-icon" src="icons/upload.svg" alt="" aria-hidden="true">
                    <span class="btn-text"> Загрузить</span>
                </button>
                <button id="createFolderBtn" onclick="createFolder()" class="primary">
                    <img class="icon btn-icon" src="icons/folder-open.svg" alt="" aria-hidden="true">
                    <span class="btn-text"> Создать папку</span>
                </button>

                <span id="taskBubbleHostMobile"></span>
            </div>
            
            <div class="toolbar-right">
                <div class="quota-display">
                    <span id="taskBubbleHostDesktop"></span>
                    <div class="quota-bar">
                        <div id="quotaProgress" class="quota-fill"></div>
                    </div>
                    <span id="quotaText" class="quota-text"></span>
                </div>
                
                <div class="user-info">
                    <span id="who"></span>
                    <span id="timer"></span>
                </div>
                
                <button id="adminPanelBtn" onclick="openAdminPanel()" class="success" style="display: none;" title="Админ-панель">
                    <img class="icon btn-icon" src="icons/admin.svg" alt="" aria-hidden="true">
                    <span class="btn-text"> Админ</span>
                </button>
                <button onclick="logout()" class="danger" title="Выйти">
                    <img class="icon btn-icon" src="icons/logout.svg" alt="" aria-hidden="true">
                    <span class="btn-text"> Выход</span>
                </button>
            </div>
        </div>
        
            <div class="file-area" id="fileArea">
                <div class="dropzone-overlay" id="dropzoneOverlay">
                    <div class="dropzone-content">
                        <div class="dropzone-icon"><img class="icon icon-xl" src="icons/upload.svg" alt="" aria-hidden="true"></div>
                        <div class="dropzone-title">Перетащите файлы сюда</div>
                        <div class="dropzone-hint">Файлы будут загружены в текущую папку</div>
                    </div>
                </div>

                <!-- Панель групповых операций (over breadcrumbs) -->
            <div id="bulkActions" class="bulk-actions" style="display: none;">
                <div class="bulk-info">
                    <span id="selectedCount">0</span> выбрано
                </div>
                <div class="bulk-buttons">
                    <button onclick="bulkDownload()" class="success"><img class="icon" src="icons/download.svg" alt="" aria-hidden="true">Скачать</button>
                    <button onclick="bulkMove()" class="primary"><img class="icon" src="icons/move.svg" alt="" aria-hidden="true">Переместить</button>
                    <button onclick="bulkDelete()" class="danger"><img class="icon" src="icons/trash.svg" alt="" aria-hidden="true">Удалить</button>
                    <button onclick="bulkPermanentDelete()" class="danger"><img class="icon" src="icons/delete-forever.svg" alt="" aria-hidden="true">Безвозвратно</button>
                    <button onclick="clearSelection()" class="secondary"><img class="icon" src="icons/cancel.svg" alt="" aria-hidden="true">Отменить</button>
                </div>
            </div>

            <div id="currentPath" class="current-path"></div>
            
            <div class="files-container">
                <table id="filesTable">
                    <thead>
                        <tr>
                            <th style="width: 40px;"><input type="checkbox" id="selectAll" onchange="toggleSelectAll()"></th>
                            <th>Имя</th>
                            <th>Размер</th>
                            <th>Дата</th>
                            <th>Ссылка</th>
                            <th>Действия</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>

            <div id="filesList" class="files-list hidden"></div>
        </div>
    </div>
</div>

<input type="file" id="fileInput" multiple style="display: none;">

<!-- Модальное окно перемещения -->
<div id="moveModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <div class="modal-title"><span class="icon-text"><img class="icon" src="icons/move.svg" alt="" aria-hidden="true">Переместить файл</span></div>
            <span class="close" onclick="closeMoveModal()">&times;</span>
        </div>
        <div class="modal-body">
            <p id="moveFileName" style="margin-bottom: 15px; font-weight: 600;"></p>
            <div class="folder-tree" id="folderTree"></div>
            <div class="modal-buttons">
                <button onclick="closeMoveModal()" class="secondary">Отмена</button>
                <button onclick="confirmMove()" class="primary">Переместить</button>
            </div>
        </div>
    </div>
</div>

<!-- Модальное окно подтверждения -->
<div id="confirmModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <div class="modal-title"><span class="icon-text"><img class="icon" src="icons/warning.svg" alt="" aria-hidden="true">Подтверждение</span></div>
            <span class="close" onclick="closeConfirmModal()">&times;</span>
        </div>
        <div class="modal-body">
            <p id="confirmMessage" style="margin-bottom: 20px; font-size: 16px;"></p>
            <div class="modal-buttons">
                <button onclick="closeConfirmModal()" class="secondary">Отмена</button>
                <button id="confirmButton" onclick="confirmAction()" class="danger">Подтвердить</button>
                <button id="confirmPermanentButton" onclick="confirmPermanentAction()" class="danger hidden">Удалить безвозвратно</button>
            </div>
        </div>
    </div>
</div>

<!-- Модальное окно ввода -->
<div id="inputModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <div class="modal-title" id="inputTitle"><span class="icon-text"><img class="icon" src="icons/edit.svg" alt="" aria-hidden="true">Ввод</span></div>
            <span class="close" onclick="closeInputModal()">&times;</span>
        </div>
        <div class="modal-body">
            <p id="inputMessage" style="margin-bottom: 15px; font-weight: 500;"></p>
            <input type="text" id="inputField" />
            <div class="modal-buttons">
                <button onclick="closeInputModal()" class="secondary">Отмена</button>
                <button onclick="confirmInput()" class="primary">ОК</button>
            </div>
        </div>
    </div>
</div>

<!-- Модальное окно действий (кнопка справа в списке) -->
<div id="actionsModal" class="modal">
    <div class="modal-content actions-sheet">
        <div class="modal-header">
            <div class="modal-title" id="actionsTitle">Действия</div>
            <span class="close" onclick="closeActionsModal()">&times;</span>
        </div>
        <div class="modal-body">
            <div id="actionsBody" class="actions-list"></div>
        </div>
    </div>
</div>

<!-- Модальное окно QR-кода -->
<div id="qrModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <div class="modal-title">QR-код для скачивания</div>
            <span class="close" onclick="closeQRModal()">&times;</span>
        </div>
        <div class="modal-body">
            <div id="qrCodeContainer"></div>
            <div id="qrShareUrl"></div>
            <div class="modal-buttons">
                <button onclick="closeQRModal()" class="secondary">Закрыть</button>
                <button id="qrDeleteShareBtn" onclick="deleteQRShareLink()" class="danger">Удалить ссылку</button>
                <button onclick="shareFileToTelegram(currentQRFileId)" class="success" id="qrTelegramBtn"><img class="icon" src="icons/telegram.svg" alt="" aria-hidden="true">Отправить в Telegram</button>
                <button onclick="copyQRUrl()" class="primary">Копировать ссылку</button>
            </div>
        </div>
    </div>
</div>

<!-- Центр задач -->
<div id="taskBackdrop" class="task-backdrop hidden"></div>
<button id="taskBubble" class="task-bubble" title="Задачи">
    <span id="taskBubbleFill" class="task-bubble-fill" aria-hidden="true"></span>
    <span id="taskBubblePct" class="pct"></span>
</button>
<aside id="taskDrawer" class="task-drawer" aria-label="Задачи">
    <div class="task-drawer-header">
        <div class="task-drawer-title">Задачи</div>
        <div class="task-controls">
            <button id="taskClearCompleted" class="secondary" title="Очистить завершенные">Очистить</button>
            <button class="secondary" onclick="TaskCenter && TaskCenter.closeDrawer && TaskCenter.closeDrawer()" title="Закрыть">×</button>
        </div>
    </div>
    <div id="taskList" class="task-drawer-body"></div>
</aside>

<script src="js/task-center.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script src="js/app/state.js"></script>
<script src="js/app/browser.js"></script>
<script src="js/app/uploads.js"></script>
<script src="js/app/file-actions.js"></script>
<script src="js/app/bulk-actions.js"></script>
<script src="js/app/bootstrap.js"></script>
</body>
</html>
