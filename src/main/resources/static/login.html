<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>EjectCloud - Вход</title>
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link rel="icon" type="image/png" href="images/twitch-logo-transparent.png">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>

<div class="login-wrapper">
    <div class="login-container">
    <!-- Форма входа -->
    <div id="loginForm">
        <div class="logo">
            <h1>☁️ EjectCloud</h1>
        </div>
        
        <form onsubmit="login(event)">
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" required>
            </div>
            
            <div class="form-group">
                <label for="password">Пароль:</label>
                <input type="password" id="password" required>
            </div>
            
            <button type="submit" class="btn" id="loginBtn">Войти</button>
            <div id="loginError" class="error"></div>
        </form>
    </div>
    
    <!-- Форма смены пароля -->
    <div id="changePasswordForm" class="change-password-form">
        <div class="form-title">Смена пароля</div>
        <p style="text-align: center; color: #666; margin-bottom: 20px;">
            Необходимо изменить пароль для продолжения работы
        </p>
        
        <form onsubmit="changePassword(event)">
            <div class="form-group">
                <label for="currentPassword">Текущий пароль:</label>
                <input type="password" id="currentPassword" required>
            </div>
            
            <div class="form-group">
                <label for="newPassword">Новый пароль:</label>
                <input type="password" id="newPassword" required minlength="6">
            </div>
            
            <div class="form-group">
                <label for="confirmPassword">Подтвердите пароль:</label>
                <input type="password" id="confirmPassword" required minlength="6">
            </div>
            
            <button type="submit" class="btn">Изменить пароль</button>
            <div id="changePasswordError" class="error"></div>
        </form>
    </div>
    
    <!-- Форма обновления профиля (для админа) -->
    <div id="profileForm" class="profile-form">
        <div class="form-title">Обновление профиля</div>
        <p style="text-align: center; color: #666; margin-bottom: 20px;">
            Пожалуйста, обновите данные профиля
        </p>
        
        <form onsubmit="updateProfile(event)">
            <div class="form-group">
                <label for="profileEmail">Email:</label>
                <input type="email" id="profileEmail" required>
            </div>
            
            <div class="form-group">
                <label for="displayName">Имя:</label>
                <input type="text" id="displayName" required>
            </div>
            
            <button type="submit" class="btn">Обновить профиль</button>
            <div id="profileError" class="error"></div>
        </form>
    </div>
    </div>
    
    <div class="logo-video">
        <video id="logoVideo" autoplay muted loop playsinline preload="metadata" poster="images/twitch-logo-transparent.png">
            <source src="images/animated-logo.webm" type="video/webm">
        </video>
        <img class="logo-fallback" src="images/twitch-logo-transparent.png" alt="EjectCloud">
    </div>
</div>

<script src="js/pages/login-logo.js"></script>

<script src="js/pages/login.js"></script>

</body>
</html>
