<!doctype html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EjectCloud - Предпросмотр</title>
    <link rel="icon" type="image/png" href="images/twitch-logo-transparent.png">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; img-src 'self' data: blob:; media-src 'self' blob:; style-src 'self' 'unsafe-inline'; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'">
    <link rel="stylesheet" href="css/icons.css">
    <link rel="stylesheet" href="css/preview.css">
</head>
<body>
    <div id="toast" class="toast"></div>
    <div class="topbar">
        <button class="btn secondary" id="backBtn">← Назад</button>
        <div class="title" id="fileTitle">Предпросмотр</div>
    </div>

    <div class="wrap">
        <div class="card">
            <div class="meta">
                <div class="kv"><b>Тип:</b> <span id="fileType">-</span></div>
                <div class="kv"><b>Размер:</b> <span id="fileSize">-</span></div>
                <div class="kv"><b>Загружен:</b> <span id="fileUploaded">-</span></div>
            </div>
            <div class="actions" id="actions"></div>
            <div class="preview" id="preview">
                <div class="hint">Loading...</div>
            </div>
        </div>
    </div>

    <div id="qrModal" class="modal" aria-hidden="true">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">QR-код для скачивания</div>
                <button id="qrCloseX" class="btn secondary icon-only" title="Закрыть">×</button>
            </div>
            <div class="modal-body">
                <div id="qrCodeContainer"></div>
                <div id="qrShareUrl"></div>
                <div class="modal-buttons">
                    <button id="qrCloseBtn" class="btn light">Закрыть</button>
                    <button id="qrDeleteShareBtn" class="btn danger">Удалить ссылку</button>
                    <button id="qrCopyBtn" class="btn primary">Копировать ссылку</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <script src="js/pages/preview.js"></script>
</body>
</html>
